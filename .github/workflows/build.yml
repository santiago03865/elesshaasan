name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip wget \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33 buildozer==1.5.0
      
      - name: Install Android SDK and Build-Tools
        run: |
          echo "=== Установка Android SDK ==="
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME
          
          # Скачиваем Android command-line tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          
          # Добавляем в PATH
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          # Принимаем лицензии
          yes | sdkmanager --licenses || true
          
          # Устанавливаем build-tools и platform-tools
          sdkmanager "platform-tools" "build-tools;33.0.2" "platforms;android-33"
          
          echo "=== Android SDK установлен ==="
          ls -la $ANDROID_HOME/build-tools/
      
      - name: Build APK with Buildozer
        env:
          ANDROID_HOME: ${{ runner.workspace }}/android-sdk
        run: |
          echo "=== Версии ==="
          python3 --version
          java -version
          buildozer --version
          echo "=== Начинаем сборку ==="
          buildozer -v android debug
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dushenka-apk
          path: bin/*.apk
          retention-days: 30
